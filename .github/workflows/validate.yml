name: Validate

on:
  push:
    branches-ignore:
      - "dependabot/**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_CACHE_DIR: .cache/pip
  PIP_ROOT_USER_ACTION: ignore
  HA_VENV: /tmp/ok-ha-venv

jobs:
  release-readiness:
    name: Release Readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify manifest requirement mirror
        run: python3 tools/sync_manifest_requirements.py --check
      - run: python3 tools/validate_release_readiness.py

  workflow-permissions:
    name: Workflow Permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restrict write-capable workflows
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import re
          import sys

          allowed: set[Path] = set()
          contents_write = re.compile(r"^\s*contents\s*:\s*['\"]?write['\"]?\s*$", re.I)
          write_all = re.compile(r"^\s*permissions\s*:\s*['\"]?write-all['\"]?\s*$", re.I)
          errors: list[str] = []

          for path in sorted(Path(".github/workflows").glob("*.yml")) + sorted(
              Path(".github/workflows").glob("*.yaml")
          ):
              for line_number, raw_line in enumerate(path.read_text().splitlines(), 1):
                  line = raw_line.split("#", 1)[0]
                  if write_all.fullmatch(line.strip()):
                      errors.append(f"{path}:{line_number}: permissions: write-all is not allowed")
                  if contents_write.fullmatch(line.strip()) and path not in allowed:
                      errors.append(
                          f"{path}:{line_number}: contents: write is not allowed for GITHUB_TOKEN"
                      )

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY

  hacs:
    name: HACS
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@ab22029681aa532bfe7de5774a9972d67bfbd2c0 # master

  python:
    name: Python / HA ${{ matrix.ha-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha-version: "2025.12.5"
            ha-image: ghcr.io/home-assistant/home-assistant:2025.12.5
          - ha-version: stable
            ha-image: ghcr.io/home-assistant/home-assistant:stable
    container: ${{ matrix.ha-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure cache archive tools
        run: |
          if tar --version 2>/dev/null | grep -qi "gnu tar"; then
            exit 0
          fi
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache tar zstd
            exit 0
          fi
          echo "GNU tar is required for actions/cache in this container."
          exit 1
      - name: Enable pip cache
        run: python -m pip config --global unset global.no-cache-dir || true
      - name: Prepare pip cache
        run: mkdir -p "$PIP_CACHE_DIR"
      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-v2-${{ runner.os }}-ha-${{ matrix.ha-version }}-${{ github.job }}-${{ hashFiles('pyproject.toml', 'requirements-manifest.txt') }}
          restore-keys: |
            pip-v2-${{ runner.os }}-ha-${{ matrix.ha-version }}-${{ github.job }}-
            pip-v2-${{ runner.os }}-ha-${{ matrix.ha-version }}-
            pip-v2-${{ runner.os }}-ha-
      - name: Validate Home Assistant requirement resolution
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          from homeassistant.util.package import install_package

          constraints = "/usr/src/homeassistant/homeassistant/package_constraints.txt"
          manifest = json.loads(Path("custom_components/ok/manifest.json").read_text())
          failed = [
              requirement
              for requirement in manifest["requirements"]
              if not install_package(requirement, constraints=constraints)
          ]
          if failed:
              raise SystemExit(
                  "Home Assistant could not install manifest requirements: "
                  + ", ".join(failed)
              )
          PY
      - name: Create isolated HA test environment
        run: |
          python -m venv --system-site-packages "$HA_VENV"
          "$HA_VENV/bin/python" -m pip install --upgrade pip
      - run: $HA_VENV/bin/python -m pip install -e ".[firebase]" -r requirements-manifest.txt "pytest>=8.4,<10" "pytest-asyncio>=1.1,<2" "pytest-cov>=6.2,<8"
      - run: $HA_VENV/bin/python -m pytest --cov=custom_components.ok --cov-report=term-missing
      - run: $HA_VENV/bin/python -c "from custom_components.ok.api._firestore import _close_owned_firestore_client, _create_default_firestore_client; client = _create_default_firestore_client(project_id='ok-ci-smoke', credentials=None); _close_owned_firestore_client(client)"

  type-check:
    name: Type Check / HA 2025.12.5
    runs-on: ubuntu-latest
    container: ghcr.io/home-assistant/home-assistant:2025.12.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ensure cache archive tools
        run: |
          if tar --version 2>/dev/null | grep -qi "gnu tar"; then
            exit 0
          fi
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache tar zstd
            exit 0
          fi
          echo "GNU tar is required for actions/cache in this container."
          exit 1
      - name: Enable pip cache
        run: python -m pip config --global unset global.no-cache-dir || true
      - name: Prepare pip cache
        run: mkdir -p "$PIP_CACHE_DIR"
      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-v2-${{ runner.os }}-ha-2025.12.5-${{ github.job }}-${{ hashFiles('pyproject.toml', 'requirements-manifest.txt') }}
          restore-keys: |
            pip-v2-${{ runner.os }}-ha-2025.12.5-${{ github.job }}-
            pip-v2-${{ runner.os }}-ha-2025.12.5-
            pip-v2-${{ runner.os }}-ha-
      - name: Create isolated HA type-check environment
        run: |
          python -m venv --system-site-packages "$HA_VENV"
          "$HA_VENV/bin/python" -m pip install --upgrade pip
      - run: $HA_VENV/bin/python -m pip install -e ".[firebase]" -r requirements-manifest.txt "mypy>=1.17,<3"
      - run: MYPYPATH=/usr/src/homeassistant $HA_VENV/bin/python -m mypy

  quality:
    name: Python Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare pip cache
        run: mkdir -p "$PIP_CACHE_DIR"
      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ runner.os }}-python-${{ matrix.python-version }}-${{ github.job }}-${{ hashFiles('pyproject.toml', 'requirements-manifest.txt', 'requirements-ci.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-python-${{ matrix.python-version }}-${{ github.job }}-
            pip-${{ runner.os }}-python-${{ matrix.python-version }}-
            pip-${{ runner.os }}-python-
      - run: python -m pip install --upgrade pip -r requirements-ci.txt
      - run: python -m ruff format --check custom_components tests tools
      - run: python -m ruff check custom_components tests tools
      - name: Build audit requirements
        run: |
          python - <<'PY' > /tmp/ok-audit-requirements.txt
          from __future__ import annotations

          from pathlib import Path
          import tomllib

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          for dependency in pyproject["project"]["dependencies"]:
              print(dependency)
          for line in Path("requirements-manifest.txt").read_text().splitlines():
              stripped = line.strip()
              if stripped and not stripped.startswith("#"):
                  print(stripped)
          PY
      - run: python -m pip_audit -r /tmp/ok-audit-requirements.txt --progress-spinner off
      - run: python -m build --outdir /tmp/dist
      - run: python -m twine check /tmp/dist/*
      - name: Check package contents
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import zipfile

          wheel = next(Path("/tmp/dist").glob("*.whl"))
          required = {
              "custom_components/ok/__init__.py",
              "custom_components/ok/manifest.json",
              "custom_components/ok/api/__init__.py",
              "custom_components/ok/py.typed",
              "custom_components/ok/translations/en.json",
          }
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          if missing := sorted(required - names):
              raise SystemExit(f"Wheel is missing required files: {missing}")
          PY

  api-client:
    name: Bundled API client / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare pip cache
        run: mkdir -p "$PIP_CACHE_DIR"
      - name: Cache pip packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ runner.os }}-python-${{ matrix.python-version }}-${{ github.job }}-${{ hashFiles('pyproject.toml', 'requirements-manifest.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-python-${{ matrix.python-version }}-${{ github.job }}-
            pip-${{ runner.os }}-python-${{ matrix.python-version }}-
            pip-${{ runner.os }}-python-
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[firebase]" -r requirements-manifest.txt "pytest>=8.4,<10" "pytest-asyncio>=1.1,<2"
      - name: Compile bundled API client
        run: |
          python - <<'PY'
          from __future__ import annotations

          import py_compile
          from pathlib import Path

          for path in sorted(Path("custom_components/ok/api").glob("*.py")):
              py_compile.compile(path, doraise=True)
          PY
      - name: Import bundled API client standalone
        run: |
          mkdir -p /tmp/ok-api-client
          cp -R custom_components/ok/api /tmp/ok-api-client/api
          PYTHONPATH=/tmp/ok-api-client python - <<'PY'
          from __future__ import annotations

          import api as ok_api
          from api import AsyncOkApiClient, OkApiClient

          print(ok_api.__version__)
          assert AsyncOkApiClient
          assert OkApiClient
          PY
      - name: Run bundled API client tests
        run: |
          python -m pytest \
            tests/test_client_async.py \
            tests/test_client_sync.py \
            tests/test_firestore.py \
            tests/test_package_metadata.py \
            tests/test_signing.py
