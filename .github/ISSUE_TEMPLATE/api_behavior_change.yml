name: OK API behavior change
description: Report a suspected OK app API, command, authentication, or realtime update change.
title: "fix(api): "
labels:
  - api-change
body:
  - type: markdown
    attributes:
      value: |
        Use this when OK app behavior appears to have changed. Do not paste passwords, tokens,
        `.storage` files, `secrets.yaml`, device identifiers, or unsanitized OK API captures.
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: Find this in HACS, the manifest, or the GitHub release you installed.
      placeholder: "latest release"
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: "2025.12.5"
    validations:
      required: true
  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area
      options:
        - Login or reauthentication
        - Charger discovery
        - Connector status
        - Realtime updates
        - Start/stop charging
        - Scheduling
        - Energy prices
        - Receipts or last-session data
        - Other
    validations:
      required: true
  - type: input
    id: affected_entity_or_action
    attributes:
      label: Affected entity or action
      description: Use the Home Assistant entity ID, action name, or config flow step if known.
      placeholder: "sensor.charger_connector_status, action ok.schedule_charging, config flow login"
    validations:
      required: true
  - type: input
    id: started_at
    attributes:
      label: When did it start?
      description: Include timezone when possible.
      placeholder: "2026-07-04 19:30 Europe/Copenhagen"
  - type: input
    id: last_known_good
    attributes:
      label: Last known working version or date
      placeholder: "v0.5.1, or 2026-07-03"
  - type: textarea
    id: app_behavior
    attributes:
      label: OK app behavior
      description: Describe whether the same account, charger, schedule, or action still works in the OK app.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic entity values
      description: Paste redacted values from last refresh, charger last refresh, and related OK entities.
      render: text
  - type: textarea
    id: readonly_repro
    attributes:
      label: Read-only reproduction steps
      description: List steps that reproduce the problem without starting, stopping, or scheduling charging.
  - type: textarea
    id: integration_behavior
    attributes:
      label: Home Assistant behavior
      description: Describe what changed in Home Assistant and when it started.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only relevant, redacted Home Assistant logs.
      render: text
